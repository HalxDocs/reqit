<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>JSON editor scroll harness</title>
  </head>
  <body class="bg-bg text-text">
    <!--
      Layout harness for the request body editor.

      It reproduces the real DOM chain that the body editor sits in:

        RequestPanel  >  div.flex-1.overflow-y-auto
                      >  BodyTab   >  div.flex.flex-col.h-full
                      >            >  div.flex-1.min-h-0
                      >            >  JsonEditor

      so the editor's scroll behaviour can be measured in a real browser
      instead of guessed at. Run the dev server and open
      /scripts/json-scroll-harness.html.
    -->
    <div
      class="shrink-0 h-full bg-bg flex flex-col min-w-0"
      id="panel"
      style="height: 600px; width: 900px"
    >
      <div class="flex items-center justify-between border-b border-border bg-surface">
        <span class="px-3 py-2 text-12">Body</span>
      </div>
      <div class="flex-1 overflow-y-auto" id="scroll-host">
        <div class="flex flex-col h-full" id="bodytab">
          <div class="flex-1 min-h-0" id="editor-host"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./json-scroll-harness.tsx"></script>
    <script>
      // Allow the panel height to be varied so the editor's behaviour can be
      // measured at different sizes: ?h=150
      const h = new URLSearchParams(location.search).get("h");
      if (h) document.getElementById("panel").style.height = `${h}px`;
    </script>
  </body>
</html>
