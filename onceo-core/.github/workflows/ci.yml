name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        # Must match the go directive in go.mod (>= 1.25.1); tests use t.Context().
        go-version: ["1.25", "1.26"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          # .golangci.yml uses the v1 config schema; golangci-lint v2 (current
          # "latest") rejects it, so pin a v1 release until the config is
          # migrated. Bump deliberately.
          version: v1.64.8

      - name: Test with race detector
        run: go test ./... -race -coverprofile=coverage.txt -covermode=atomic -count=1 -timeout=120s

      - name: Check coverage
        run: |
          go tool cover -func=coverage.txt | tail -1 | awk '{print $NF}' | sed 's/%//' | awk '{if ($1 < 78) {print "Coverage " $1 "% < 78%"; exit 1}}'

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.txt
          flags: unittests
