run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - unused
    - gofmt
    - goimports
    - godot
    - revive

linters-settings:
  govet:
    enable-all: true
  errcheck:
    check-type-assertions: true
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/HalxDocs/onceo-core
  revive:
    rules:
      - name: exported
        severity: warning
  gosec:
    excludes:
      - G107

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
  max-issues-per-linter: 0
  max-same-issues: 0
